---
apiVersion: mariadb.openstack.org/v1beta1
kind: MariaDBAccount
metadata:
  labels:
    dbName: openstack
  name: chainsawdb-some-system-db-account
status:
  currentSecret: some-system-db-secret
  conditions:
  - message: Setup complete
    reason: Ready
    status: "True"
    type: Ready
  - message: MariaDBAccount creation complete
    reason: Ready
    status: "True"
    type: MariaDBAccountReady
  - message: MariaDB / Galera server ready
    reason: Ready
    status: "True"
    type: MariaDBServerReady
---
apiVersion: v1
data:
  DatabasePassword: ZGJzZWNyZXQx
kind: Secret
metadata:
  name: some-system-db-secret
  # ensure finalizer was added
  finalizers:
  - openstack.org/mariadbaccount
type: Opaque
---
apiVersion: batch/v1
kind: Job
metadata:
  # Job is named for the MariaDBAccount, not for spec.userName; accounts
  # sharing a userName across Galera instances each need their own Job
  name: chainsawdb-some-system-db-account-account-create-update
spec:
  template:
    spec: {}
status:
  succeeded: 1
