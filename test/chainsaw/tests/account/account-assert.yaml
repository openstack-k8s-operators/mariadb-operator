---
apiVersion: mariadb.openstack.org/v1beta1
kind: MariaDBAccount
metadata:
  labels:
    mariaDBDatabaseName: testdb-accounttest
  name: testdb-some-db-account
status:
  conditions:
  - message: Setup complete
    reason: Ready
    status: "True"
    type: Ready
  - message: MariaDBAccount creation complete
    reason: Ready
    status: "True"
    type: MariaDBAccountReady
  - message: MariaDBDatabase ready
    reason: Ready
    status: "True"
    type: MariaDBDatabaseReady
  - message: MariaDB / Galera server ready
    reason: Ready
    status: "True"
    type: MariaDBServerReady
---
apiVersion: batch/v1
kind: Job
metadata:
  # Job is named for the MariaDBAccount, not for spec.userName; accounts
  # sharing a userName across Galera instances each need their own Job
  name: testdb-some-db-account-account-create-update
status:
  succeeded: 1
